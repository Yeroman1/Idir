name: idir_app
description: Idir Management App — transparent record-keeping for Ethiopian community mutual-aid associations.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1

  # Secure storage (PIN / tokens)
  flutter_secure_storage: ^9.2.2

  # PDF reports
  pdf: ^3.11.1
  printing: ^5.13.2

  # Utilities
  intl: ^0.20.0
  equatable: ^2.0.5
  uuid: ^4.4.2
  crypto: ^3.0.3
  go_router: ^14.2.7
  shared_preferences: ^2.3.2
  http: ^1.2.2
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  riverpod_generator: ^2.4.3
  build_runner: ^2.4.11
  custom_lint: ^0.7.6
  riverpod_lint: ^2.4.3

flutter:
  uses-material-design: true
  generate: true   # enables flutter gen-l10n

  assets:
    - assets/images/
    - assets/icons/

  fonts:
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic-Regular.ttf
        - asset: assets/fonts/NotoSansEthiopic-Bold.ttf
          weight: 700
